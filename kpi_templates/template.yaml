# Level 3 — KPI specification template (WP7)
# One instantiated copy of this per UC-specific KPI. `dimensions` and
# `related_metric` are the two fields that replace the original template's
# single "ISO trustworthiness characteristic" tag -- see KPI template slide.

name: ""                 # Name of the KPI
description: ""          # Brief description
dimensions: []            # WP3 Level 1 dimension id(s), from dimensions/taxonomy.yaml
related_metric: ""        # metric_id of the Level 2 metric this operationalises,
                           # e.g. "faithfulness", "trial_consistency"
formula: ""                # Mathematical formula
unit: ""                    # Unit of measure
range: ""                   # Logical upper & lower limits
trend: ""                    # "higher_is_better" | "lower_is_better"
timing: ""                    # "on_demand" | "periodic" | "real_time"
user_category: ""              # Intended user category (from WP2)
evaluation_component: ""        # Method of measuring the KPI
use_case: ""                     # e.g. "UC1", "UC3", "UC5"

