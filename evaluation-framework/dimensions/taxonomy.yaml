# Level 1 -- Trustworthiness Evaluation Taxonomy
# 10 dimensions -> 15 ISO/IEC TS 5723 trustworthiness characteristics

dimensions:
  - id: accuracy
    name: Accuracy
    definition: >
      Closeness of results, computations, or estimates to the true or
      accepted values. (ISO, 2022)
    characteristics: [Accuracy, Quality, Integrity]

  - id: robustness
    name: Robustness
    definition: >
      Responds appropriately under perturbed inputs/environments;
      consistent responses across repeated runs.
    characteristics: [Robustness, Reliability, Resilience, Availability]
    notes: >
      Availability is dual-mapped: systems/uptime aspect (MTBF, MTTR)
      lives here; user-facing accessibility aspect lives under
      Human-centricity.

  - id: safety_security_privacy
    name: Safety, Security & Privacy
    definition: >
      Resists harm to life/health/property/environment & unauthorized
      acts; protects private affairs. Includes jailbreak/prompt-injection
      resistance. Covers privacy (freedom from intrusion into the
      private life or affairs of an individual) and security
      (resistance to intentional, unauthorized acts designed to cause
      harm or damage).
    characteristics: [Safety, Security, Privacy]

  - id: fairness_ethical_legal
    name: Fairness, Ethical & Legal Aspects
    definition: >
      Ethical implications and legal frameworks (e.g. EU AI Act)
      governing AI accountability, incl. bias and fairness across
      groups and contexts.
    characteristics: [Accountability, Safety, Privacy]

  - id: transparency_explainability
    name: Transparency & Explainability
    definition: >
      Given an audience, produces details or reasons that make its
      functioning clear and easy to understand (Herrera, 2025) --
      Explainability -- combined with the open, comprehensive,
      accessible, clear presentation of information -- Transparency.
    characteristics: [Transparency, Controllability]

  - id: accountability
    name: Accountability
    definition: >
      Roles, responsibilities, and oversight mechanisms are clearly
      defined and enforced - whether oversight is defined, distinct
      from Autonomy's "is it followed".
    characteristics: [Accountability]

  - id: autonomy
    name: Autonomy
    definition: >
      The agent operates within sanctioned boundaries; human oversight
      is preserved. Includes whether the oversight mechanism itself is
      present and working (interruptibility, override success,
      confirmation-gating).
    characteristics: [Controllability]

  - id: auditability
    name: Auditability / Verifiability
    definition: >
      Ability to meet stakeholders' expectations in a way that can be
      verified; underpinned by authenticity -- the system is what it
      claims to be. Covers documentation, provenance, and incident
      logs.
    characteristics: [Accountability, Transparency, Authenticity]

  - id: efficiency
    name: Efficiency
    definition: >
      Compute, latency, and other resource costs relative to a
      partner- or use-case-declared budget.
    characteristics: []

  - id: human_centricity
    name: Human-centricity
    definition: >
      User trust and satisfaction, but also controllability, usability,
      and human agency in interacting with the system.
    characteristics: [Usability, Controllability, Availability]
    notes: >
      Availability here = accessibility/reachability on demand from the
      user's side, distinct from the uptime/MTBF aspect under
      Robustness. Metrics in this dimension are mostly survey/
      human-subject-based (see metrics/human_centricity/), not
      automated -- requires participant recruitment and, depending on
      jurisdiction, ethics review.
