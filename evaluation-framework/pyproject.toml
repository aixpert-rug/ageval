[project]
name = "aixpert-evaluation-framework"
version = "0.1.0"
description = "AIXPERT WP3 trustworthiness evaluation framework: dimensions, metrics/methods, and KPI templates."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
